name: EmberTVCompanion
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
targets:
  EmberTVCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.embertv.companion
        PRODUCT_NAME: EmberTV Companion
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  EmberTVCompanion:
    build:
      targets:
        EmberTVCompanion: all
    run:
      config: Debug
    archive:
      config: Release
