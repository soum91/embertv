name: Sync verified Drift Android TV releases

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: embertv-drift-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android signing verification tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
      - name: Verify signed Drift APK and update catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_drift_android.py
      - name: Publish catalog only when a newer verified release exists
        run: |
          set -euo pipefail
          if git diff --quiet -- repo.json; then
            echo 'No new verified Drift Android TV release. Catalog unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m 'catalog: sync signed Drift Android TV release'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
