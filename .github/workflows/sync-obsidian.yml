name: Build signed Obsidian TV Companion and sync EmberTV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-obsidian.yml'
      - 'scripts/sync_obsidian_android.py'
  schedule:
    - cron: '13 */6 * * *'

permissions:
  contents: write

concurrency:
  group: embertv-obsidian-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out Obsidian TV companion source
        uses: actions/checkout@v4
        with:
          repository: soum91/phosphor
          ref: main
          path: obsidian-source
          fetch-depth: 0
          persist-credentials: false
      - name: Determine companion version
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD="$(git -C obsidian-source rev-list --count HEAD -- TVCompanion)"
          test "$BUILD" -gt 0
          TAG="obsidian-tv-v0.1.0.$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require stable EmberTV signing identity
        if: steps.info.outputs.publish == 'true'
        run: |
          if [ "$HAS_SIGNING" != 'true' ]; then
            echo 'Missing stable EmberTV Android signing key. Refusing to publish a debug-signed APK.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.info.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.info.outputs.publish == 'true'
        with:
          gradle-version: '8.10.2'
      - name: Compile unsigned Obsidian TV Companion
        if: steps.info.outputs.publish == 'true'
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          gradle --no-daemon -p obsidian-source/TVCompanion \
            -POBSIDIAN_BUILD_NUMBER="$BUILD_NUMBER" :app:assembleRelease
      - name: Sign APK with EmberTV permanent certificate
        if: steps.info.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass.txt"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/keypass.txt"
          APK='obsidian-source/TVCompanion/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/embertv-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/storepass.txt" \
            --key-pass "file:$RUNNER_TEMP/keypass.txt" \
            --out Obsidian-TV-Companion.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Obsidian-TV-Companion.apk > "$RUNNER_TEMP/signer.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/signer.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging Obsidian-TV-Companion.apk | grep -F "package: name='com.soum91.obsidian.tv' versionCode='$BUILD_NUMBER'"
      - uses: actions/upload-artifact@v4
        if: steps.info.outputs.publish == 'true'
        with:
          name: Obsidian-TV-Companion-signed-${{ steps.info.outputs.build }}
          path: Obsidian-TV-Companion.apk
      - name: Publish signed APK to GitHub Release
        if: steps.info.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C obsidian-source rev-parse HEAD)"
          gh release create "$TAG" Obsidian-TV-Companion.apk --repo "$GITHUB_REPOSITORY" \
            --title "Obsidian TV Companion 0.1.0.$BUILD_NUMBER" \
            --notes "Android TV companion for Obsidian's iPhone Live tab, built from soum91/phosphor $SOURCE_SHA. Pair by scanning the QR on the TV with the iPhone Camera, then start Live View on TV and approve Android screen capture. Beta preview, experimental remote controls, and no DRM or HDMI-source capture. Signed with EmberTV's permanent Android key for update continuity."
      - name: Fetch existing signed APK when unchanged
        if: steps.info.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Obsidian-TV-Companion.apk --dir .
      - name: Verify signed release and update EmberTV main JSON
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          test -s Obsidian-TV-Companion.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Obsidian-TV-Companion.apk > "$RUNNER_TEMP/verified.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/verified.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging Obsidian-TV-Companion.apk | grep -F "package: name='com.soum91.obsidian.tv' versionCode='$BUILD_NUMBER'"
          python3 scripts/sync_obsidian_android.py --apk Obsidian-TV-Companion.apk \
            --build "$BUILD_NUMBER" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Obsidian-TV-Companion.apk"
          if git diff --quiet -- repo.json; then
            echo 'EmberTV catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m "catalog: publish signed Obsidian TV Companion 0.1.0.$BUILD_NUMBER"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
