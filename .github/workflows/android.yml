name: Android TV build and release
on:
  push:
    branches: [main]
    paths:
      - 'tv/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'scripts/update_repo.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embertv-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      EMBER_VERSION_CODE: ${{ github.run_number }}
      EMBER_VERSION_NAME: 0.1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android TV APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EmberTV-debug-unsigned-release-${{ github.run_number }}
          path: tv/app/build/outputs/apk/debug/*.apk
      - name: Build signed release APK with persistent signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embertv.jks"
          export EMBER_KEYSTORE_PATH="$RUNNER_TEMP/embertv.jks"
          gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature is EmberTV's permanent release certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK='tv/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature-check.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/signature-check.txt"
      - name: Upload signed APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EmberTV-signed-${{ github.run_number }}
          path: tv/app/build/outputs/apk/release/*.apk
      - name: Publish signed release and update JSON feed
        if: env.HAS_SIGNING == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD='${{ github.run_number }}'
          VERSION="0.1.0.$BUILD"
          TAG="tv-v$VERSION"
          APK='tv/app/build/outputs/apk/release/app-release.apk'
          cp "$APK" "$RUNNER_TEMP/EmberTV.apk"
          PREV="$(git tag --sort=-v:refname -l 'tv-v*' | head -1)"
          if [ -n "$PREV" ]; then git log "$PREV"..HEAD --pretty='* %s' --no-merges > "$RUNNER_TEMP/notes.txt"; else git log -20 --pretty='* %s' --no-merges > "$RUNNER_TEMP/notes.txt"; fi
          test -s "$RUNNER_TEMP/notes.txt" || printf 'Maintenance build %s\n' "$BUILD" > "$RUNNER_TEMP/notes.txt"
          gh release create "$TAG" "$RUNNER_TEMP/EmberTV.apk" --title "EmberTV $VERSION" --notes-file "$RUNNER_TEMP/notes.txt"
          python3 scripts/update_repo.py tv --version "$VERSION" --build "$BUILD" --url "https://github.com/${{ github.repository }}/releases/download/$TAG/EmberTV.apk" --artifact "$APK" --notes "$RUNNER_TEMP/notes.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m "catalog: publish EmberTV $VERSION"
          git push origin HEAD:main
      - name: Explain signing requirement
        if: env.HAS_SIGNING != 'true'
        run: echo 'Compilation complete. No GitHub release was published because the stable Android signing secrets are not configured. Do not install the ephemeral debug APK if update continuity matters.'
