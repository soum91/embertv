name: Build and sign Aukkhor TV with existing EmberTV key
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-aukkhor.yml'
      - 'scripts/sync_aukkhor_android.py'
  schedule:
    - cron: '43 */3 * * *'

permissions:
  contents: write

concurrency:
  group: embertv-aukkhor-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the Aukkhor Android TV source
        uses: actions/checkout@v4
        with:
          repository: soum91/aukkhor
          ref: main
          path: aukkhor-source
          fetch-depth: 0
          persist-credentials: false
      - name: Find latest Aukkhor Android TV source build
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD="$(git -C aukkhor-source rev-list --count HEAD -- android-tv)"
          test "$BUILD" -gt 0
          TAG="aukkhor-tv-v0.3.0.$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify permanent signing key exists
        if: steps.info.outputs.publish == 'true'
        run: |
          if [ "$HAS_SIGNING" != 'true' ]; then
            echo 'Missing stable EmberTV signing secret; refusing to publish an ephemeral APK' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.info.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compilation and signing tools
        if: steps.info.outputs.publish == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.info.outputs.publish == 'true'
        with:
          gradle-version: '8.10.2'
      - name: Run Android TV keyboard regression tests before signing
        if: steps.info.outputs.publish == 'true'
        working-directory: aukkhor-source/android-tv
        run: gradle --no-daemon :app:testReleaseUnitTest
      - name: Compile unsigned release APK
        if: steps.info.outputs.publish == 'true'
        working-directory: aukkhor-source/android-tv
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: gradle --no-daemon -PAUKKHOR_BUILD_NUMBER="$BUILD_NUMBER" :app:assembleRelease
      - name: Sign with existing permanent EmberTV Android certificate
        if: steps.info.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass.txt"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/keypass.txt"
          APK='aukkhor-source/android-tv/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/embertv-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/storepass.txt" \
            --key-pass "file:$RUNNER_TEMP/keypass.txt" \
            --out "$RUNNER_TEMP/Aukkhor-TV.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Aukkhor-TV.apk" > "$RUNNER_TEMP/signature.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$RUNNER_TEMP/Aukkhor-TV.apk" | grep -F "package: name='dev.soum91.aukkhor.tv' versionCode='$BUILD_NUMBER'"
          cp "$RUNNER_TEMP/Aukkhor-TV.apk" Aukkhor-TV.apk
      - uses: actions/upload-artifact@v4
        if: steps.info.outputs.publish == 'true'
        with:
          name: Aukkhor-TV-signed-${{ steps.info.outputs.build }}
          path: Aukkhor-TV.apk
      - name: Publish signed GitHub release
        if: steps.info.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          SHA="$(git -C aukkhor-source rev-parse HEAD)"
          gh release create "$TAG" Aukkhor-TV.apk --repo "$GITHUB_REPOSITORY" \
            --title "Aukkhor TV 0.3.0.${{ steps.info.outputs.build }}" \
            --notes "Built from soum91/aukkhor commit $SHA. D-pad keyboard with focused TV-sized keys, hold-to-delete, action-aware Enter, English/phonetic Bangla/direct Bangla, optional number row and secure paired iPhone typing. Signed with EmberTV's permanent Android certificate for in-place updates. iPhone pairs directly to TV without Windows. iPhone prompts while Aukkhor is foregrounded."
      - name: Download previously published release when no build is needed
        if: steps.info.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Aukkhor-TV.apk --dir .
      - name: Verify signed APK again, then update EmberTV JSON
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          test -s Aukkhor-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs Aukkhor-TV.apk > "$RUNNER_TEMP/verified.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/verified.txt"
          python3 scripts/sync_aukkhor_android.py --apk Aukkhor-TV.apk --build "$BUILD_NUMBER" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Aukkhor-TV.apk"
          if git diff --quiet -- repo.json; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m "catalog: publish signed Aukkhor TV 0.3.0.$BUILD_NUMBER"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
