name: Build signed BridgeDeck TV and sync EmberTV catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-bridgedeck.yml'
      - 'scripts/sync_bridgedeck_android.py'
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

concurrency:
  group: embertv-bridgedeck-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out BridgeDeck Android TV source
        uses: actions/checkout@v4
        with:
          repository: soum91/bridgedeck
          ref: main
          path: bridgedeck-source
          fetch-depth: 0
          persist-credentials: false
      - name: Determine BridgeDeck Android TV source version
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD="$(git -C bridgedeck-source rev-list --count HEAD -- androidtv)"
          test "$BUILD" -gt 0
          TAG="bridgedeck-tv-v0.1.0.$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Signed $TAG is already published; refreshing catalog."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require EmberTV permanent signing certificate
        if: steps.info.outputs.publish == 'true'
        run: |
          if [ "$HAS_SIGNING" != 'true' ]; then
            echo 'Missing permanent EmberTV signing key; refusing to publish an ephemeral debug-signed companion.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and verification tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.info.outputs.publish == 'true'
        with:
          gradle-version: '8.12'
      - name: Compile unsigned BridgeDeck TV release
        if: steps.info.outputs.publish == 'true'
        working-directory: bridgedeck-source/androidtv
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: gradle --no-daemon -PBRIDGEDECK_BUILD_NUMBER="$BUILD_NUMBER" :app:assembleRelease
      - name: Sign with EmberTV permanent Android certificate
        if: steps.info.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embertv-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass.txt"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/keypass.txt"
          APK='bridgedeck-source/androidtv/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/embertv-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/storepass.txt" \
            --key-pass "file:$RUNNER_TEMP/keypass.txt" \
            --out BridgeDeck-TV.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs BridgeDeck-TV.apk > "$RUNNER_TEMP/signature.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging BridgeDeck-TV.apk | grep -F "package: name='com.soum91.bridgedeck.tv' versionCode='$BUILD_NUMBER'"
      - name: Upload signed BridgeDeck TV artifact
        if: steps.info.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BridgeDeck-TV-signed-${{ steps.info.outputs.build }}
          path: BridgeDeck-TV.apk
      - name: Publish signed BridgeDeck TV APK from EmberTV
        if: steps.info.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C bridgedeck-source rev-parse HEAD)"
          gh release create "$TAG" BridgeDeck-TV.apk --repo "$GITHUB_REPOSITORY" \
            --title "BridgeDeck TV 0.1.0.$BUILD_NUMBER" \
            --notes "BridgeDeck TV presence/discovery companion built from soum91/bridgedeck commit $SOURCE_SHA. Signed with EmberTV's permanent Android certificate for in-place updates. This app cannot enable ADB; the user must authorize ADB over the local network."
      - name: Download existing signed release when unchanged
        if: steps.info.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern BridgeDeck-TV.apk --dir .
      - name: Verify release signature and update EmberTV catalog
        env:
          BUILD_NUMBER: ${{ steps.info.outputs.build }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          test -s BridgeDeck-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs BridgeDeck-TV.apk > "$RUNNER_TEMP/verified.txt"
          grep -i -F 'bc429067869a9bf11f16233dd29c54fe443290c4a76652a1d7ed1b2f3a15dfd2' "$RUNNER_TEMP/verified.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging BridgeDeck-TV.apk | grep -F "package: name='com.soum91.bridgedeck.tv' versionCode='$BUILD_NUMBER'"
          python3 scripts/sync_bridgedeck_android.py --apk BridgeDeck-TV.apk --build "$BUILD_NUMBER" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BridgeDeck-TV.apk"
          if git diff --quiet -- repo.json; then
            echo 'EmberTV catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m "catalog: publish signed BridgeDeck TV 0.1.0.$BUILD_NUMBER"
          for attempt in 1 2 3; do
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
